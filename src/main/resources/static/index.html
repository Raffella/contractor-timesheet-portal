<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a1121">
  <title>Contractor Timesheet Portal</title>
  <link rel="stylesheet" href="/styles.css?v=2">
  <script src="/login.js?v=dashboard" defer></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div id="app"><main id="main" class="loading">Loading your workspace…</main></div>
  <div id="toast" class="toast" role="status" hidden></div>
  <dialog id="dialog" aria-labelledby="dialog-title">
    <form method="dialog">
      <span class="dialog-icon" id="dialog-icon"></span>
      <h2 id="dialog-title"></h2>
      <p id="dialog-copy"></p>
      <div class="actions"><button value="cancel" class="button secondary" autofocus>Cancel</button><button value="confirm" id="confirm" class="button primary"></button></div>
    </form>
  </dialog>
</body>
</html>
